<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة دليل الحاج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', system-ui, sans-serif; }
        body { background: #f2f5f9; color: #1a2e35; min-height: 100vh; padding: 20px; }
        .admin-container { max-width: 1400px; margin: auto; background: white; border-radius: 24px; padding: 25px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e9e6; padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .admin-header h1 { font-size: 24px; color: #075c52; }
        .admin-header .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .admin-header .actions a, .admin-header .actions button { padding: 10px 20px; border-radius: 60px; text-decoration: none; font-weight: 600; font-size: 14px; border: none; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: #075c52; color: white; }
        .btn-primary:hover { background: #064e45; }
        .btn-outline { background: transparent; border: 2px solid #e2e8f0; color: #4a5568; }
        .btn-outline:hover { background: #f7fafc; }
        .btn-gold { background: #c99625; color: white; border: none; }
        .btn-gold:hover { background: #b8860b; }
        .btn-danger-outline { background: transparent; border: 2px solid #fc8181; color: #e53e3e; }
        .btn-danger-outline:hover { background: #fff5f5; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: #f7fafc; padding: 20px 25px; border-radius: 20px; border-right: 5px solid #075c52; }
        .stat-card .label { font-size: 14px; color: #718096; }
        .stat-card .value { font-size: 32px; font-weight: 800; color: #1a2e35; margin-top: 5px; }
        .stat-card .sub { font-size: 12px; color: #a0aec0; margin-top: 5px; }
        .stat-card.gold { border-right-color: #c99625; }
        .stat-card.blue { border-right-color: #3182ce; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; background: #f7fafc; padding: 15px 25px; border-radius: 20px; }
        .toolbar .search-box { display: flex; align-items: center; background: white; border-radius: 60px; padding: 5px 15px; flex: 1; min-width: 200px; border: 1px solid #e2e8f0; }
        .toolbar .search-box i { color: #a0aec0; margin-left: 10px; }
        .toolbar .search-box input { border: none; background: transparent; padding: 12px 0; width: 100%; font-size: 14px; outline: none; }
        .toolbar .add-btn { background: #075c52; color: white; border: none; padding: 12px 28px; border-radius: 60px; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .toolbar .add-btn:hover { background: #064e45; }
        .table-wrapper { background: white; border-radius: 24px; padding: 10px 0; overflow-x: auto; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: right; padding: 16px 20px; background: #f7fafc; color: #4a5568; font-weight: 700; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
        td { padding: 14px 20px; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
        tr:hover { background: #f7fafc; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 60px; font-size: 12px; font-weight: 600; }
        .status-badge.active { background: #c6f6d5; color: #276749; }
        .status-badge.inactive { background: #edf2f7; color: #4a5568; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.green { background: #48bb78; }
        .status-dot.gray { background: #a0aec0; }
        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .action-btns button { border: none; width: 34px; height: 34px; border-radius: 10px; font-size: 14px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .action-btns .loc-btn { background: #ebf8ff; color: #2b6cb0; }
        .action-btns .edit-btn { background: #fefcbf; color: #d69e2e; }
        .action-btns .del-btn { background: #fed7d7; color: #e53e3e; }
        .action-btns button:hover { transform: scale(1.1); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: white; border-radius: 32px; padding: 30px; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-box .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-box .modal-header h2 { color: #075c52; }
        .modal-box .modal-header .close-modal { background: none; border: none; font-size: 28px; color: #a0aec0; cursor: pointer; }
        .modal-box .form-group { margin-bottom: 18px; }
        .modal-box .form-group label { display: block; font-weight: 600; font-size: 13px; color: #4a5568; margin-bottom: 5px; }
        .modal-box .form-group input { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 15px; transition: 0.2s; background: white; }
        .modal-box .form-group input:focus { border-color: #075c52; outline: none; }
        .modal-box .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .modal-box .save-btn { width: 100%; padding: 16px; background: #075c52; color: white; border: none; border-radius: 60px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .modal-box .save-btn:hover { background: #064e45; }
        #locationMap { height: 300px; border-radius: 16px; margin: 15px 0; background: #edf2f7; }
        .coord-inputs { display: flex; gap: 10px; }
        .coord-inputs input { flex: 1; }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a2e35; color: white; padding: 14px 30px; border-radius: 60px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 9999; opacity: 0; transition: all 0.4s ease; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        @media (max-width: 768px) { .admin-header { flex-direction: column; align-items: stretch; text-align: center; } .admin-header .actions { justify-content: center; } .toolbar { flex-direction: column; } .toolbar .search-box { width: 100%; } .modal-box .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="admin-container" id="adminContent">
        <div class="admin-header">
            <h1><i class="fas fa-user-cog"></i> لوحة تحكم دليل الحاج</h1>
            <div class="actions">
                <a href="./" target="_blank" class="btn-primary"><i class="fas fa-external-link-alt"></i> فتح التطبيق</a>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="label">إجمالي الحجاج</div><div class="value" id="totalPilgrims">0</div><div class="sub">مسجل في النظام</div></div>
            <div class="stat-card gold"><div class="label">موقع محدد</div><div class="value" id="locatedPilgrims">0</div><div class="sub">تم تحديد مواقعهم</div></div>
            <div class="stat-card blue"><div class="label">آخر إضافة</div><div class="value" id="lastAdded">-</div><div class="sub">أحدث حاج</div></div>
        </div>
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث بالاسم، الكود، الجنسية أو الهاتف..." onkeyup="filterTable()">
            </div>
            <button class="add-btn" onclick="openAddModal()"><i class="fas fa-plus"></i> إضافة حاج جديد</button>
            <button class="btn-outline" onclick="exportCSV()"><i class="fas fa-file-csv"></i> CSV</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم</th>
                        <th>الكود</th>
                        <th>رقم الهاتف</th>
                        <th>الجنسية</th>
                        <th>تاريخ الإضافة</th>
                        <th>الموقع</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="pilgrimsTableBody"><tr><td colspan="8" style="text-align:center;padding:40px;color:#a0aec0;">جاري تحميل البيانات...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- مودال الإضافة -->
    <div class="modal-overlay" id="addEditModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-user-plus"></i> إضافة حاج</h2>
                <button class="close-modal" onclick="closeModal('addEditModal')">&times;</button>
            </div>
            <input type="hidden" id="editId">
            <div class="form-row">
                <div class="form-group"><label>اسم الحاج</label><input type="text" id="inputName" placeholder="مثال: أحمد"></div>
                <div class="form-group"><label>الشفرة</label><input type="text" id="inputCode" placeholder="مثال: 1234"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>رقم الهاتف</label><input type="text" id="inputPhone" placeholder="مثال: 0501234567"></div>
                <div class="form-group"><label>الجنسية</label><input type="text" id="inputNationality" placeholder="مثال: سعودي"></div>
            </div>
            <div class="form-group"><label>معرف المستخدم (اختياري)</label><input type="text" id="inputUserId" placeholder="اتركه فارغاً للتلقائي"></div>
            <button class="save-btn" onclick="savePilgrim()"><i class="fas fa-save"></i> حفظ البيانات</button>
        </div>
    </div>

    <!-- مودال الموقع -->
    <div class="modal-overlay" id="locationModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2><i class="fas fa-map-marked-alt"></i> تحديد موقع الحاج</h2>
                <button class="close-modal" onclick="closeModal('locationModal')">&times;</button>
            </div>
            <p style="color:#4a5568;margin-bottom:10px;" id="locPilgrimName">الحاج: ---</p>
            <div id="locationMap"></div>
            <div class="coord-inputs">
                <input type="text" id="locLat" placeholder="خط العرض (Lat)">
                <input type="text" id="locLng" placeholder="خط الطول (Lng)">
            </div>
            <button class="save-btn" onclick="saveLocation()" style="margin-top:15px;"><i class="fas fa-check-circle"></i> حفظ الموقع</button>
        </div>
    </div>

    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = "https://tmmspfxkmqsivpxchfkk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_e_UeWsqQTEk0GUhdpMDHYg_nAC3b7vZ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allPilgrims = [], currentLocationPilgrimId = null, map = null, marker = null;

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = isError ? '#e53e3e' : '#1a2e35';
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadPilgrims() {
            const tbody = document.getElementById('pilgrimsTableBody');
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#a0aec0;">جاري التحميل...</td></tr>';
            const { data, error } = await supabase.from('pilgrims').select('*').order('id', { ascending: false });
            if (error) { tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:red;">خطأ: ${error.message}</td></tr>`; showToast('خطأ في التحميل', true); return; }
            allPilgrims = data || [];
            renderTable(allPilgrims);
            updateStats(allPilgrims);
        }

        function renderTable(list) {
            const tbody = document.getElementById('pilgrimsTableBody');
            if (!list || list.length === 0) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#a0aec0;">لا يوجد حجاج مسجلين</td></tr>'; return; }
            tbody.innerHTML = list.map((p, i) => {
                const hasLocation = p.latitude && p.longitude;
                const dateStr = p.created_at ? new Date(p.created_at).toLocaleDateString('ar-SA') : '-';
                return `<tr>
                    <td>${i+1}</td>
                    <td><strong>${esc(p.name)}</strong></td>
                    <td>${esc(p.code)}</td>
                    <td>${esc(p.phone||'—')}</td>
                    <td>${esc(p.nationality||'—')}</td>
                    <td>${dateStr}</td>
                    <td><span class="status-badge ${hasLocation?'active':'inactive'}"><span class="status-dot ${hasLocation?'green':'gray'}"></span>${hasLocation?'محدد':'غير محدد'}</span></td>
                    <td><div class="action-btns">
                        <button class="loc-btn" onclick="openLocationModal('${p.id}','${esc(p.name)}')"><i class="fas fa-map-pin"></i></button>
                        <button class="edit-btn" onclick="openEditModal('${p.id}','${esc(p.name)}','${esc(p.code)}','${esc(p.phone||'')}','${esc(p.nationality||'')}','${esc(p.user_id||'')}')"><i class="fas fa-edit"></i></button>
                        <button class="del-btn" onclick="deletePilgrim('${p.id}','${esc(p.name)}')"><i class="fas fa-trash"></i></button>
                    </div></td>
                </tr>`;
            }).join('');
        }

        function esc(t){ if(!t) return ''; return String(t).replace(/[&<>"]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; if(m==='"') return '&quot;'; return m; }); }

        function updateStats(data) {
            document.getElementById('totalPilgrims').textContent = data.length;
            document.getElementById('locatedPilgrims').textContent = data.filter(p=>p.latitude&&p.longitude).length;
            document.getElementById('lastAdded').textContent = data.length&&data[0].created_at?new Date(data[0].created_at).toLocaleDateString('ar-SA'):'-';
        }

        function filterTable() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if(!q) return renderTable(allPilgrims);
            renderTable(allPilgrims.filter(p=>p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)||(p.phone&&p.phone.includes(q))||(p.nationality&&p.nationality.toLowerCase().includes(q))));
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-plus"></i> إضافة حاج';
            document.getElementById('editId').value = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputCode').value = '';
            document.getElementById('inputPhone').value = '';
            document.getElementById('inputNationality').value = '';
            document.getElementById('inputUserId').value = '';
            document.getElementById('addEditModal').classList.add('show');
        }

        function openEditModal(id, name, code, phone, nationality, userId) {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> تعديل حاج';
            document.getElementById('editId').value = id;
            document.getElementById('inputName').value = name;
            document.getElementById('inputCode').value = code;
            document.getElementById('inputPhone').value = phone||'';
            document.getElementById('inputNationality').value = nationality||'';
            document.getElementById('inputUserId').value = userId||'';
            document.getElementById('addEditModal').classList.add('show');
        }

        function closeModal(id) { document.getElementById(id).classList.remove('show'); if(id==='locationModal'&&map){ map.remove(); map=null; } }

        async function savePilgrim() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('inputName').value.trim();
            const code = document.getElementById('inputCode').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const nationality = document.getElementById('inputNationality').value.trim();
            const userId = document.getElementById('inputUserId').value.trim()||'00000000-0000-0000-0000-000000000000';
            if(!name||!code){ showToast('⚠️ يرجى ملء الاسم والشفرة', true); return; }
            const payload = { name, code, phone, nationality, user_id: userId };
            let result; if(id) result = await supabase.from('pilgrims').update(payload).eq('id', id); else result = await supabase.from('pilgrims').insert([payload]);
            if(result.error){ showToast('❌ خطأ: '+result.error.message, true); return; }
            showToast(id?'✅ تم التعديل':'✅ تم الإضافة');
            closeModal('addEditModal'); loadPilgrims();
        }

        async function deletePilgrim(id, name) { if(!confirm(`حذف "${name}"؟`)) return; const {error} = await supabase.from('pilgrims').delete().eq('id', id); if(error){ showToast('❌ خطأ', true); return; } showToast(`🗑️ تم حذف ${name}`); loadPilgrims(); }

        function openLocationModal(id, name) {
            currentLocationPilgrimId = id;
            document.getElementById('locPilgrimName').textContent = 'الحاج: ' + name;
            document.getElementById('locLat').value = ''; document.getElementById('locLng').value = '';
            document.getElementById('locationModal').classList.add('show');
            setTimeout(() => {
                if(map){ map.remove(); map=null; }
                map = L.map('locationMap').setView([21.4225, 39.8262], 6);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
                supabase.from('pilgrim_locations').select('*').eq('pilgrim_id', id).maybeSingle().then(({data})=>{
                    if(data && data.latitude && data.longitude){ const lat=parseFloat(data.latitude), lng=parseFloat(data.longitude); document.getElementById('locLat').value=lat; document.getElementById('locLng').value=lng; map.setView([lat,lng],13); marker=L.marker([lat,lng]).addTo(map); } else { if(navigator.geolocation){ navigator.geolocation.getCurrentPosition((pos)=>{ const lat=pos.coords.latitude, lng=pos.coords.longitude; document.getElementById('locLat').value=lat; document.getElementById('locLng').value=lng; map.setView([lat,lng],13); marker=L.marker([lat,lng]).addTo(map); }, ()=>{}); } }
                });
                map.on('click', function(e){ const lat=e.latlng.lat, lng=e.latlng.lng; document.getElementById('locLat').value=lat.toFixed(6); document.getElementById('locLng').value=lng.toFixed(6); if(marker) map.removeLayer(marker); marker=L.marker([lat,lng]).addTo(map); });
            }, 300);
        }

        async function saveLocation() {
            const lat = parseFloat(document.getElementById('locLat').value), lng = parseFloat(document.getElementById('locLng').value);
            if(isNaN(lat)||isNaN(lng)){ showToast('⚠️ يرجى تحديد موقع', true); return; }
            if(!currentLocationPilgrimId){ showToast('⚠️ خطأ', true); return; }
            const {error} = await supabase.from('pilgrim_locations').upsert({ pilgrim_id: currentLocationPilgrimId, latitude: lat, longitude: lng, updated_at: new Date().toISOString() }, { onConflict: 'pilgrim_id' });
            if(error){ showToast('❌ خطأ: '+error.message, true); return; }
            showToast('✅ تم حفظ الموقع'); closeModal('locationModal'); loadPilgrims();
        }

        function exportCSV() {
            if(!allPilgrims||allPilgrims.length===0){ showToast('لا توجد بيانات', true); return; }
            let csv = "الاسم,الكود,رقم الهاتف,الجنسية,المعرف,تاريخ الإضافة,الموقع\n";
            allPilgrims.forEach(p=>{ const hasLoc=(p.latitude&&p.longitude)?'محدد':'غير محدد'; const date=p.created_at?new Date(p.created_at).toLocaleDateString('ar-SA'):'-'; csv+=`"${p.name}","${p.code}","${p.phone||''}","${p.nationality||''}","${p.user_id||''}","${date}","${hasLoc}"\n`; });
            const blob = new Blob(["\uFEFF"+csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'الحجاج.csv'; link.click(); showToast('📥 تم التصدير');
        }

        document.addEventListener('DOMContentLoaded', loadPilgrims);
        console.log('✅ لوحة إدارة بدون حماية - تعمل فوراً');
    </script>
</body>
</html>
