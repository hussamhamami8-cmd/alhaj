<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075c52">
<meta name="description" content="دليل الحاج - رفيقك في رحلة الحج">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/logo.svg">
<link rel="stylesheet" href="style.css">
<title>دليل الحاج</title>
</head>

<body>

<div id="app">

<header class="topbar">
  <button class="icon-btn" id="menuBtn">☰</button>

  <div class="brand">
    <img src="images/logo.svg">
    <div>
      <b>دليل الحاج</b>
      <small>رحلتك إلى البيت العتيق</small>
    </div>
  </div>

  <button class="icon-btn" id="themeBtn">☾</button>
</header>

<main id="main">

<section class="welcome">
  <div>
    <span>بسم الله الرحمن الرحيم</span>
    <h1>رفيقك في رحلة الحج</h1>
    <p>مناسك وأماكن وأدعية وإرشادات في مكان واحد.</p>
  </div>
</section>

<div class="search">
  <span>⌕</span>
  <input id="search" placeholder="ابحث عن منسك أو مكان أو دعاء...">
</div>

<section class="quick">

<button data-page="rituals">
<strong>🕋</strong>
<span>مناسك الحج</span>
</button>

<button data-page="places">
<strong>🗺️</strong>
<span>أماكن الحج</span>
</button>

<button data-page="duas">
<strong>🤲</strong>
<span>الأدعية</span>
</button>

<button data-page="guide">
<strong>✦</strong>
<span>إرشادات الحاج</span>
</button>

</section>

<section class="journey-card">

<div class="section-head">
<div>
<small>رحلة الحج</small>
<h2>مراحل رحلة الحج</h2>
</div>

<span class="progress">6 مراحل</span>
</div>

<div class="timeline">
<i>الإحرام</i>
<i>مكة</i>
<i>عرفة</i>
<i>مزدلفة</i>
<i>منى</i>
<i>الوداع</i>
</div>

</section>

<section>

<div class="section-head">
<div>
<small>اكتشف</small>
<h2>أهم الأماكن</h2>
</div>

<button class="link" data-page="places">عرض الكل</button>
</div>

<div id="placeGrid" class="cards"></div>

</section>

</main>

<nav class="bottom">

<button class="active" data-page="home">
⌂
<span>الرئيسية</span>
</button>

<button data-page="places">
⌖
<span>الأماكن</span>
</button>

<button data-page="rituals">
☰
<span>المناسك</span>
</button>

<button data-page="favorites">
♡
<span>المفضلة</span>
</button>

<button data-page="settings">
⚙
<span>الإعدادات</span>
</button>

</nav>

<div id="drawer" class="drawer">

<div class="drawer-head">

<img src="images/logo.svg">

<b>دليل الحاج</b>

<button id="closeDrawer">×</button>

</div>

<div class="drawer-links">

<button data-page="home">⌂ الرئيسية</button>
<button data-page="rituals">🕋 مناسك الحج</button>
<button data-page="places">🗺️ أماكن الحج</button>
<button data-page="duas">🤲 الأدعية والأذكار</button>
<button data-page="guide">✦ إرشادات الحاج</button>
<button data-page="favorites">♡ المفضلة</button>
<button data-page="settings">⚙ الإعدادات</button>

</div>

</div>

<div id="shade"></div>

<div id="page" class="page" hidden>

<header class="page-head">

<button id="backBtn">‹</button>

<h2 id="pageTitle"></h2>

<span></span>

</header>

<div id="pageContent"></div>

</div>

<div id="detail" class="detail" hidden>

<header class="page-head">

<button id="detailBack">‹</button>

<h2 id="detailTitle"></h2>

<button id="favBtn">♡</button>

</header>

<div id="detailContent"></div>

</div>

</div>
<script src="app.js"></script>

</body>
</html>
